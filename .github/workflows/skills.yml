name: Agent skills

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.agent/skills/**'
      - 'scripts/sync_skills.py'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.claude/skills/**'
      - '.agent/skills/**'
      - 'scripts/sync_skills.py'

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sync_skills.py --check
